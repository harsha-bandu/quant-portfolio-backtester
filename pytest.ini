[pytest]
# PyTest Configuration for AlphaForge

# Minimum version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multi-component workflows
    regression: Regression tests for behavior preservation
    slow: Tests that take > 5 seconds to run

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (if pytest-cov is installed)
# addopts = --cov=. --cov-report=html --cov-report=term

# Logging
log_cli = false
log_cli_level = INFO
log_file = tests.log
log_file_level = DEBUG

# Timeout (requires pytest-timeout)
# timeout = 300

# Doctest
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
